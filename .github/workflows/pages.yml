name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'CHANGELOG.md'
      - '.github/workflows/pages.yml'
  # No `release: published` trigger: release events run on a tag ref, and the github-pages
  # environment only allows deployments from main. release.yml's `pages` job calls this
  # workflow after the draft release has its DMG and is published, because a release created
  # with GITHUB_TOKEN doesn't start other workflows. Merging the release PR also triggers a
  # push deploy (CHANGELOG.md changes); that one still shows the previous version, because
  # drafts aren't "latest". The `pages` job supersedes it once the release is published.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/configure-pages@v6
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          # Avoids the anonymous API rate limit when looking up the latest release.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
