name: PR title

# Pull requests are squash-merged, and the squash commit takes the PR title as its
# message. release-please reads those messages, so the title must be a Conventional
# Commit. release-please's own PRs ("chore(main): release x.y.z") already match.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title is a Conventional Commit
        env:
          # Through env, never interpolated into the script: titles are untrusted input.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'
          if [[ "$TITLE" =~ $PATTERN ]]; then
            echo "OK: $TITLE"
          else
            echo "::error::PR title \"$TITLE\" isn't a Conventional Commit. Use 'type(scope): summary', for example 'fix(audio): keep the tap alive after sleep'. Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert. Add ! before the colon for a breaking change."
            exit 1
          fi
