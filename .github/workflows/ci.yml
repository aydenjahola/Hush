name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        # latest-stable follows the runner image, so this doesn't break when the image updates.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          swift format --version
      - name: Lint
        run: swift format lint --strict --recursive Sources Tests Package.swift
      # Warnings fail CI only; Package.swift stays free of unsafeFlags so contributors aren't blocked
      # by a new compiler's diagnostics while developing.
      - name: Build (warnings are errors)
        run: swift build --build-tests -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test
      - name: Build the app bundle
        run: make app

  website-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.diff.outputs.website }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        name: Did this pull request change website/?
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -q '^website/'; then
            echo "website=true" >> "$GITHUB_OUTPUT"
          else
            echo "website=false" >> "$GITHUB_OUTPUT"
          fi

  website:
    needs: website-changes
    if: needs.website-changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build with link validation
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # EXPERIMENTAL: real Core Audio integration tests (make integration-test) with BlackHole 2ch.
  # Hosted runners have no audio hardware and no way to click a TCC prompt, so this depends on
  # scripts/ci-grant-audio-capture.sh writing TCC.db (only possible with SIP disabled). If the grant
  # doesn't take, the tests skip themselves rather than fail. continue-on-error keeps this job from
  # blocking merges; make it required (drop continue-on-error) once it has proven reliable.
  integration:
    runs-on: macos-26
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        # latest-stable follows the runner image, so this doesn't break when the image updates.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          swift format --version
      - name: Install BlackHole 2ch
        run: |
          brew install --cask blackhole-2ch
          sudo killall coreaudiod || true
      - name: Wait for BlackHole
        run: |
          for _ in $(seq 1 30); do
            if system_profiler SPAudioDataType 2>/dev/null | grep -q "BlackHole 2ch"; then
              echo "BlackHole 2ch is available."
              exit 0
            fi
            sleep 2
          done
          echo "BlackHole 2ch didn't appear within 60 s; end-to-end tests will skip."
      - name: Grant Audio Recording (experimental)
        run: scripts/ci-grant-audio-capture.sh
      - name: Integration tests
        run: |
          set -o pipefail
          # ALLOW_SKIP: until the TCC grant is proven, a run where everything skips isn't a failure.
          ALLOW_SKIP=1 make integration-test 2>&1 | tee integration.log
      - name: Summary
        if: always()
        run: |
          # Per-test result lines; "Test run with ..." is the overall summary, not a test.
          tests=$(grep -E '^[^ ]+ Test ' integration.log | grep -v ' Test run with ' || true)
          passed=$(printf '%s\n' "$tests" | grep -c ' passed after' || true)
          skipped=$(printf '%s\n' "$tests" | grep -E ' skipped([:.]|$)' | grep -cvE ' (passed|failed) after' || true)
          failed=$(printf '%s\n' "$tests" | grep -c ' failed after' || true)
          echo "Integration tests: ${passed} passed, ${skipped} skipped, ${failed} failed"
          {
            echo "### Core Audio integration tests (experimental)"
            echo "${passed} passed, ${skipped} skipped, ${failed} failed"
          } >> "$GITHUB_STEP_SUMMARY"
