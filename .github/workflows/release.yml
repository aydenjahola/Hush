name: Release

# One workflow on purpose. A release that release-please creates with GITHUB_TOKEN
# doesn't trigger other workflows (no `release: published`, no tag `push`), so a
# separate "build on release" workflow would never run. The DMG build and the
# website redeploy are therefore downstream jobs here, gated on release_created.
#
# Releases are immutable once published (Settings → "Enable release immutability"),
# so release-please creates a *draft* (release-please-config.json: "draft": true,
# "force-tag-creation": true so the vX.Y.Z tag exists straight away). build-dmg uploads
# every asset to the draft, verifies the checksums, and only then publishes it. pages
# runs after publishing, so the site sees the new latest release.
#
# workflow_dispatch finishes an existing draft (for example after a failed build):
# it skips release-please and rebuilds, uploads and publishes the given tag. It refuses
# a release that's already published: that can't be changed, so ship a new patch release.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing draft release to build and publish (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # release-please labels its PRs "autorelease: pending" / "autorelease: tagged".
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-dmg:
    needs: release-please
    # On dispatch release-please is skipped, so `!cancelled()` stops that skip from
    # skipping this job too. On push, a failed release-please leaves release_created empty.
    # Dispatch only from main, so the workflow that publishes is the reviewed one.
    if: >-
      !cancelled() && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        needs.release-please.outputs.release_created == 'true'
      )
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      # Drafts are only visible to, and editable by, a token with write access.
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
      GH_REPO: ${{ github.repository }}
      # Secrets can't be used in `if:` directly, so expose whether they exist.
      # Without them the release ships an ad-hoc-signed DMG (the free route).
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.MACOS_CERT_PASSWORD != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_APPLE_ID != '' && secrets.NOTARY_TEAM_ID != '' && secrets.NOTARY_PASSWORD != '' }}
    steps:
      - name: Check the release is an unpublished draft
        # bash (not the default `bash -e`) adds pipefail, so a failed API call isn't read as zero releases.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' isn't a release tag like v1.2.3"
            exit 1
          fi
          # Only a token with write access sees drafts; the list includes them, the
          # releases/tags endpoint doesn't.
          COUNT="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$TAG\")] | length" | awk '{ n += $1 } END { print n + 0 }')"
          if [ "$COUNT" = "0" ]; then
            echo "::error::No release exists for $TAG. Merge the release PR (release-please creates the draft), or pass the tag of an existing draft."
            exit 1
          fi
          if [ "$COUNT" != "1" ]; then
            echo "::error::$COUNT releases exist for $TAG. Delete the extra drafts in the Releases page, then run this workflow again with tag $TAG."
            exit 1
          fi
          IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          if [ "$IS_DRAFT" != "true" ]; then
            echo "::error::$TAG is already published. Published releases are immutable, so its assets can't be replaced. Fix the problem on main and ship a new patch release instead."
            exit 1
          fi
          echo "$TAG is a draft; building it."

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          # Full history, so CFBundleVersion (git rev-list --count HEAD) is right.
          fetch-depth: 0
          # This job never pushes; uploads go through gh with GH_TOKEN.
          persist-credentials: false

      - name: Select Xcode
        # latest-stable follows the runner image, so this doesn't break when the image updates.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          swift format --version

      - name: Check version matches tag
        run: |
          VERSION="$(cat version.txt)"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG doesn't match version.txt ($VERSION)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Test
        run: make test

      - name: Warn about partial signing secrets
        if: env.HAS_SIGNING != env.HAS_NOTARY
        run: |
          if [ "$HAS_SIGNING" = "true" ]; then
            echo "::warning::Signing secrets are set but notary secrets aren't: the DMG will be Developer ID signed but not notarized, so Gatekeeper will still block it."
          else
            echo "::warning::Notary secrets are set but signing secrets aren't: notarization needs a Developer ID signature, so the DMG will be ad-hoc signed and not notarized."
          fi

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Split on purpose: one argument per existing keychain path (no spaces on the runner).
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity in MACOS_CERT_P12_BASE64"
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build universal DMG
        # SIGN_IDENTITY is "-" (ad-hoc) unless the import step set a Developer ID.
        run: make dmg ARCHS="arm64 x86_64" SIGN_IDENTITY="${SIGN_IDENTITY:--}"

      - name: Sign DMG
        if: env.HAS_SIGNING == 'true'
        run: codesign --force --sign "$SIGN_IDENTITY" --timestamp "build/Hush-$VERSION.dmg"

      - name: Notarize and staple DMG
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          # Keep the app-specific password in the temporary keychain rather than
          # on the submit command line.
          xcrun notarytool store-credentials hush-notary \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" \
            --keychain "$KEYCHAIN"
          RESULT="$RUNNER_TEMP/notary.json"
          xcrun notarytool submit "build/Hush-$VERSION.dmg" \
            --keychain-profile hush-notary --keychain "$KEYCHAIN" \
            --wait --output-format json > "$RESULT" || true
          cat "$RESULT"
          ID="$(plutil -extract id raw -o - "$RESULT" 2>/dev/null || true)"
          STATUS="$(plutil -extract status raw -o - "$RESULT" 2>/dev/null || true)"
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization failed (status: ${STATUS:-unknown})"
            if [ -n "$ID" ]; then
              xcrun notarytool log "$ID" --keychain-profile hush-notary --keychain "$KEYCHAIN" || true
            fi
            exit 1
          fi
          xcrun stapler staple "build/Hush-$VERSION.dmg"

      - name: Refresh Hush.dmg copy
        # make dmg copied the DMG before signing/stapling; copy the final one.
        run: cp "build/Hush-$VERSION.dmg" build/Hush.dmg

      - name: Checksums
        # One file per DMG, so `shasum -a 256 -c` works with just the file you downloaded.
        working-directory: build
        run: |
          shasum -a 256 "Hush-$VERSION.dmg" > "Hush-$VERSION.dmg.sha256"
          shasum -a 256 Hush.dmg > Hush.dmg.sha256
          cat "Hush-$VERSION.dmg.sha256" Hush.dmg.sha256
          shasum -a 256 -c "Hush-$VERSION.dmg.sha256" Hush.dmg.sha256

      - name: Upload to the draft release
        # --clobber replaces assets left by an earlier attempt, so a re-run on the same
        # draft works. Replacing assets is allowed on drafts; it would fail once published.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" \
            "build/Hush-$VERSION.dmg" \
            build/Hush.dmg \
            "build/Hush-$VERSION.dmg.sha256" \
            build/Hush.dmg.sha256 \
            --clobber

      - name: Verify the uploaded assets
        # Download what the draft actually holds and check it against the checksums, so a
        # truncated or stale upload can't be published (and then never fixed).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHECK="$RUNNER_TEMP/release-check"
          mkdir -p "$CHECK"
          gh release download "$TAG" --dir "$CHECK" --clobber \
            --pattern "Hush-$VERSION.dmg" --pattern Hush.dmg \
            --pattern "Hush-$VERSION.dmg.sha256" --pattern Hush.dmg.sha256
          cd "$CHECK" || exit 1
          shasum -a 256 -c "Hush-$VERSION.dmg.sha256" Hush.dmg.sha256
          cmp "Hush-$VERSION.dmg.sha256" "$GITHUB_WORKSPACE/build/Hush-$VERSION.dmg.sha256"
          cmp Hush.dmg.sha256 "$GITHUB_WORKSPACE/build/Hush.dmg.sha256"

      - name: Publish the release
        # The point of no return: once published, the release and its assets are immutable.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Don't take "Latest" from a newer release if an older draft is finished late.
          LATEST="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)"
          # No published release yet (404) leaves something that isn't a tag; ignore it.
          [[ "$LATEST" =~ ^v[0-9] ]] || LATEST=""
          HIGHEST="$(printf '%s\n%s\n' "$TAG" "$LATEST" | sed '/^$/d' | sort -V | tail -1)"
          if [ -n "$LATEST" ] && [ "$HIGHEST" != "$TAG" ]; then
            echo "::warning::$LATEST is newer than $TAG, so $TAG is published without becoming the latest release."
            gh release edit "$TAG" --draft=false --latest=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi
          gh release view "$TAG" --json isDraft,url --jq '"Published: \(.url) (draft: \(.isDraft))"'

      - name: Remove signing keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  # Redeploys the website once the release is published, so the download label (which
  # reads the latest *published* release) shows the new version. A skipped or failed
  # build-dmg skips this. The explicit `if` is needed because on dispatch release-please is
  # skipped, and a skipped ancestor would otherwise skip this job. The github-pages
  # environment only deploys from main (build-dmg already skips dispatches from elsewhere).
  # Pages deploys need these permissions granted by the caller.
  pages:
    needs: build-dmg
    if: ${{ !cancelled() && needs.build-dmg.result == 'success' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
